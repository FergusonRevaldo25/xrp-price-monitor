name: Live 1-Minute XRP Ticker

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  live-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run ticker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python xrpprice.py
