name: Live 1-Minute XRP Ticker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: xrp-price-monitor
  cancel-in-progress: false

jobs:
  live-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 googlenewsdecoder matplotlib

      - name: Verify Matplotlib
        run: |
          python -c "import matplotlib; print('Matplotlib version:', matplotlib.__version__)"

      - name: Run ticker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python -u xrpprice.py

      - name: Save XRP state
        if: always()
        run: |
          if [ -f xrp_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add xrp_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update XRP monitor state"
              git push
            else
              echo "No changes to XRP state."
            fi
          else
            echo "No xrp_state.json file found; nothing to save."
          fi
